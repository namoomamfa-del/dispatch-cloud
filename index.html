        const DEFAULT_PAY_SETTINGS = { day: 12500, sleep: 37500, grave: 0, picnic: 0 };
        const getTodayStr = () => { const now = new Date(); return new Date(now.getTime() + (9 * 60 * 60 * 1000)).toISOString().split('T')[0]; };
        const getTodayDate = () => { const [y, m, d] = getTodayStr().split('-'); return new Date(parseInt(y), parseInt(m) - 1, parseInt(d)); };

        const parseLocalDate = (dateStr) => {
            if (!dateStr) return new Date();
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        const SOLAR_HOLIDAYS = { "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일", "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "성탄절" };
        const generateHolidays = () => {
            const calendar = new KoreanLunarCalendar();
            const holidays = {};
            const addSubstitute = (dateStr, name, originalDateObj) => {
                const day = originalDateObj.getDay(); 
                let subDate = new Date(originalDateObj);
                let needed = false;
                if (["설날 연휴", "설날", "추석 연휴", "추석"].includes(name)) { if (day === 0) needed = true; } 
                else if (["어린이날", "삼일절", "광복절", "개천절", "한글날", "성탄절", "부처님오신날"].includes(name)) { if (day === 0 || day === 6) needed = true; }
                if (needed) {
                    subDate.setDate(subDate.getDate() + 1);
                    if (day === 6) subDate.setDate(subDate.getDate() + 1); 
                    while (holidays[subDate.toISOString().split('T')[0]]) subDate.setDate(subDate.getDate() + 1);
                    holidays[subDate.toISOString().split('T')[0]] = "대체공휴일";
                }
            };
            for (let year = 2024; year <= 2054; year++) {
                Object.entries(SOLAR_HOLIDAYS).forEach(([md, name]) => {
                    const dateStr = `${year}-${md}`; holidays[dateStr] = name;
                    if (name !== "신정" && name !== "현충일") addSubstitute(dateStr, name, new Date(year, parseInt(md.split('-')[0])-1, parseInt(md.split('-')[1])));
                });
                const lunarEvents = [{ m: 1, d: 1, name: "설날" }, { m: 4, d: 8, name: "부처님오신날" }, { m: 8, d: 15, name: "추석" }];
                lunarEvents.forEach(evt => {
                    calendar.setLunarDate(year, evt.m, evt.d, false);
                    const solar = calendar.getSolarCalendar();
                    const dateStr = `${solar.year}-${String(solar.month).padStart(2,'0')}-${String(solar.day).padStart(2,'0')}`;
                    const dateObj = new Date(solar.year, solar.month - 1, solar.day);
                    if (evt.name === "설날" || evt.name === "추석") {
                        const prevDate = new Date(dateObj); prevDate.setDate(dateObj.getDate() - 1);
                        const nextDate = new Date(dateObj); nextDate.setDate(dateObj.getDate() + 1);
                        holidays[prevDate.toISOString().split('T')[0]] = `${evt.name} 연휴`;
                        holidays[dateStr] = evt.name;
                        holidays[nextDate.toISOString().split('T')[0]] = `${evt.name} 연휴`;
                        [prevDate, dateObj, nextDate].forEach(d => {
                            if (d.getDay() === 0) {
                                let sub = new Date(nextDate); sub.setDate(sub.getDate() + 1);
                                while(holidays[sub.toISOString().split('T')[0]]) sub.setDate(sub.getDate() + 1);
                                holidays[sub.toISOString().split('T')[0]] = "대체공휴일";
                            }
                        });
                    } else { holidays[dateStr] = evt.name; addSubstitute(dateStr, evt.name, dateObj); }
                });
            }
            return holidays;
        };
        const GENERATED_HOLIDAYS = generateHolidays();
        const getHolidayName = (dateStr) => GENERATED_HOLIDAYS[dateStr] || null;
        const isPublicHoliday = (dateStr) => {
            if (!dateStr) return false;
            const dayOfWeek = new Date(dateStr).getDay();
            if (dayOfWeek === 0 || dayOfWeek === 6) return true;
            return !!GENERATED_HOLIDAYS[dateStr];
        };

        const calculateWorkHours = (start, end, isDateHoliday, isForceHoliday) => {
            if (!start || !end) return { work: 0, extra: 0, adjusted: 0, valid: false };
            const [sH, sM] = start.split(':').map(Number);
            const [eH, eM] = end.split(':').map(Number);
            let startMin = sH * 60 + sM;
            let endMin = eH * 60 + eM;
            if (endMin < startMin) endMin += 24 * 60;
            let diffMin = endMin - startMin;
            let totalHours = diffMin / 60;
            const work = Math.max(0, totalHours - 1); 
            let extra = 0, adjusted = 0;
            if (isDateHoliday || isForceHoliday) {
                const regularHolidayWork = Math.min(8, work);
                const overtimeHolidayWork = Math.max(0, work - 8);
                adjusted = (regularHolidayWork * 1.5) + (overtimeHolidayWork * 2.0);
                extra = overtimeHolidayWork; 
            } else {
                const overtimeWeekday = Math.max(0, work - 8);
                adjusted = overtimeWeekday * 1.5;
                extra = overtimeWeekday;
            }
            return { work: parseFloat(work.toFixed(1)), extra: parseFloat(extra.toFixed(1)), adjusted: parseFloat(adjusted.toFixed(3)), valid: true };
        };

        const calculateTotalWorkHours = (info, startDateStr) => {
            if (!info) return { work: 0, extra: 0, adjusted: 0, valid: false };
            let totalWork = 0; let totalExtra = 0; let totalAdjusted = 0; let valid = true;
            const times = info.dailyTimes || [{ startTime: info.startTime || '09:00', endTime: info.endTime || '18:00', isHolidayWork: info.isHolidayWork || false }];
            times.forEach((dayTime, idx) => {
                const d = new Date(startDateStr); d.setDate(d.getDate() + idx);
                const dStr = d.toISOString().split('T')[0];
                const res = calculateWorkHours(dayTime.startTime, dayTime.endTime, isPublicHoliday(dStr), dayTime.isHolidayWork);
                if (!res.valid) valid = false;
                totalWork += res.work; totalExtra += res.extra; totalAdjusted += res.adjusted;
            });
            return { work: parseFloat(totalWork.toFixed(1)), extra: parseFloat(totalExtra.toFixed(1)), adjusted: parseFloat(totalAdjusted.toFixed(3)), valid };
        };

        const DEFAULT_DRIVERS = ["박기준", "변석현", "이명순", "김탁", "한상훈", "문인식", "황덕일", "강철규", "이상헌"];

        const AutoSaveInput = ({ value, onSave, className, placeholder, type = "text", disabled, ...props }) => {
            const [localValue, setLocalValue] = useState(value || "");
            useEffect(() => { setLocalValue(value || ""); }, [value]);
            const handleChange = (e) => { setLocalValue(e.target.value); };
            const handleBlur = () => { if (localValue !== (value || "")) { onSave(localValue); } };
            const handleKeyDown = (e) => { if (e.key === 'Enter') { e.target.blur(); } }
            return <input type={type} className={className} placeholder={placeholder} value={localValue} onChange={handleChange} onBlur={handleBlur} onKeyDown={handleKeyDown} disabled={disabled} {...props} />;

        const adaptStatus = (arr, def, n) => {
            if (!arr) return Array(n).fill(def);
            if (arr.length === n) return arr;

        const App = () => {

            const isEditAllowed = isAdmin;

            const calculatePay = (info) => {
                if (!info) return 0;
                if (info.customPay) return parseInt(info.customPay) || 0;
                const type = info.operationType || '공공예약';
                const duration = info.duration || 1;

                if (type === '나들이') return paySettings.picnic || 0;

                const numDuration = parseInt(duration) || 1;
                if (numDuration <= 1) return paySettings.day;
                return paySettings.sleep * numDuration;

            const getMaskedName = useCallback((name, targetDateStr, isDriver = true) => {

                const diffDays = Math.floor((targetDate.getTime() - today.getTime()) / 86400000);
                if (diffDays > 9) return "(비공개)"; 
                return name;
            }, [isAdmin]);

                };
            }, [user]);

            const calculateDispatchLogic = (dayData, drivers, vehicles, excludedDriverIds = new Set()) => {
                if (!dayData) return [];
                const currentRanks = dayData.driverRanks && dayData.driverRanks.length === drivers.length ? dayData.driverRanks : drivers.map((_, i) => i + 1);
                
                // 💡 투명인간(제외) 처리 필터링 적용
                let pool = drivers.map((nm, i) => ({ 
                    nm, id: i, 
                    active: nm && (dayData.driverStatus ? dayData.driverStatus[i] : true), 
                    tempOff: dayData.tempOffStatus ? dayData.tempOffStatus[i] : false,
                    cancelled: dayData.cancelStatus ? dayData.cancelStatus[i] : false,
                    rank: currentRanks[i] 
                })).filter(d => d.active && !excludedDriverIds.has(d.id) && dayData.employedStatus[d.id]).sort((a, b) => a.rank - b.rank);
                
                const resIds = Object.keys(dayData.reserved || {});
                const sortedV = vehicles.filter(v => resIds.includes(v.id)).sort((a, b) => {
                    const infoA = dayData.reserved[a.id] || {}; const infoB = dayData.reserved[b.id] || {};
                    if (a.type !== b.type) return a.type === 'BUS' ? -1 : 1;
                    const durationA = (infoA.duration === 2 || infoA.duration === 3) ? infoA.duration : 1;
                    const durationB = (infoB.duration === 2 || infoB.duration === 3) ? infoB.duration : 1;
                    if (durationA !== durationB) return durationA - durationB;
                    if ((infoA.km || 0) !== (infoB.km || 0)) return (infoA.km || 0) - (infoB.km || 0);
                    if (a.type === 'BUS') {
                        const getBusRank = (name) => { if (name.includes('3호')) return 1; if (name.includes('1호')) return 2; if (name.includes('2호')) return 3; return 4; };
                        return getBusRank(a.name) - getBusRank(b.name);
                    }
                    return a.name.localeCompare(b.name);
                });

                const result = [];
                const manualAssignments = {}; 
                Object.entries(dayData.overrides || {}).forEach(([key, dId]) => { manualAssignments[key] = dId; pool = pool.filter(p => p.id !== dId); });

                sortedV.forEach(v => {
                    const info = dayData.reserved[v.id] || {};
                    const slots = [];
                    const effectiveCapacity = info.isSingleDriver ? 1 : v.capacity;
                    for(let i=0; i<effectiveCapacity; i++) {
                        const key = v.id + "_" + i;
                        let autoDriver = null;
                        if (!info.isEmergency && pool.length > 0) autoDriver = pool.shift();

                        if (manualAssignments[key] !== undefined) {
                            const dId = manualAssignments[key];
                            slots.push({ nm: drivers[dId] || '삭제됨', id: dId, type: info.isEmergency ? 'emergency' : 'manual', rank: currentRanks[dId], consumedAutoDriverId: autoDriver ? autoDriver.id : undefined });
                        } else if (info.isUnavailable) {
                            slots.push(autoDriver ? { ...autoDriver, type: 'excluded', isExcluded: true } : null);
                        } else {
                            if (autoDriver && (autoDriver.cancelled || autoDriver.tempOff)) {
                                slots.push({ ...autoDriver, isCancelledByRank: true });
                            } else {
                                slots.push(autoDriver ? { ...autoDriver, type: 'auto' } : null);
                            }
                        }
                    }
                    result.push({ vehicle: v, slots, info: info });
                });
                return result;
            };

            const allScheduleWithRanks = useMemo(() => {
                const dates = Object.keys(scheduleData).sort();
                const n = driverNames.length;
                if (n === 0) return {};

                const processedSchedule = {};
                let lastDriverId = -1;
                let currentRanks = Array.from({length: n}, (_, i) => i + 1);

                dates.forEach(date => {
                    if (lastDriverId !== -1) {
                        const newRanks = Array(n).fill(0);
                        let startIdx = (lastDriverId + 1) % n;
                        let currentRank = 1;
                        // 💡 여기서 제외된 사람은 순번 롤링에서 제외하지 않고 그대로 포함시킵니다 (기존 순번 꼬임 방지)
                        for (let k = 0; k < n; k++) { newRanks[(startIdx + k) % n] = currentRank++; }
                        currentRanks = newRanks;
                    }

                    const rawDayData = scheduleData[date] || {};
                    const getPrevDate = (d, offset) => { const dateObj = new Date(d); dateObj.setDate(dateObj.getDate() - offset); return dateObj.toISOString().split('T')[0]; };
                    const d1 = getPrevDate(date, 1); const d2 = getPrevDate(date, 2);
                    const excludedIds = new Set();
                    if (processedSchedule[d1]) {
                        processedSchedule[d1].dispatchResult.forEach(r => { if (r.info?.duration >= 2 && !r.info?.isCancelled) r.slots.forEach(s => s && !s.isExcluded && !s.isCancelledByRank && excludedIds.add(s.id)); });
                    }
                    if (processedSchedule[d2]) {
                        processedSchedule[d2].dispatchResult.forEach(r => { if (r.info?.duration >= 3 && !r.info?.isCancelled) r.slots.forEach(s => s && !s.isExcluded && !s.isCancelledByRank && excludedIds.add(s.id)); });
                    }

                    // 💡 현재 날짜 기준의 고용 상태 판별
                    const employedStatus = driverNames.map((_, i) => {
                        const joined = driverJoinDates[i];
                        const left = driverLeaveDates[i];
                        if (joined && date < joined) return false;
                        if (left && date >= left) return false;
                        return true;
                    });

                    const computedDayData = { 
                        ...rawDayData, 
                        driverRanks: currentRanks, 
                        ondutyStatus: adaptStatus(rawDayData.ondutyStatus, false, n), 
                        driverStatus: adaptStatus(rawDayData.driverStatus, true, n),
                        tempOffStatus: adaptStatus(rawDayData.tempOffStatus, false, n),
                        cancelStatus: adaptStatus(rawDayData.cancelStatus, false, n),
                        employedStatus
                    };
                    
                    const dispatchResult = calculateDispatchLogic(computedDayData, driverNames, vehiclesList, excludedIds);

                    let dailyLastDriver = -1;
                    let maxRank = -1;

                    for (let i = 0; i < dispatchResult.length; i++) {
                        const item = dispatchResult[i];
                        if (item.info?.isEmergency) continue; 
                        for (let j = 0; j < item.slots.length; j++) {
                             const slot = item.slots[j];
                             if (slot) {
                                 const targetId = slot.consumedAutoDriverId !== undefined ? slot.consumedAutoDriverId : slot.id;
                                 if (targetId !== -1 && currentRanks[targetId] > maxRank) {
                                     maxRank = currentRanks[targetId];
                                     dailyLastDriver = targetId;
                                 }
                             }
                        }
                    }

                    for(let i=0; i<n; i++) {
                        if ((computedDayData.cancelStatus[i] || computedDayData.tempOffStatus[i]) && currentRanks[i] > maxRank) {
                            maxRank = currentRanks[i];
                            dailyLastDriver = i;
                        }
                    }

                    if (dailyLastDriver !== -1) lastDriverId = dailyLastDriver;
                    processedSchedule[date] = { ...computedDayData, dispatchResult, lastDriverId: dailyLastDriver !== -1 ? dailyLastDriver : lastDriverId, excludedIds };
                });
                return processedSchedule;
            }, [scheduleData, driverNames, driverJoinDates, driverLeaveDates, vehiclesList]);

            const getCalculatedDayData = (dateStr) => {
                if (allScheduleWithRanks[dateStr]) return allScheduleWithRanks[dateStr];
                const dates = Object.keys(allScheduleWithRanks).sort();
                const prevDates = dates.filter(d => d < dateStr);
                let lastDriverId = -1;
                if (prevDates.length > 0) lastDriverId = allScheduleWithRanks[prevDates[prevDates.length - 1]].lastDriverId;

                const n = driverNames.length;
                let currentRanks = Array.from({length: n}, (_, i) => i + 1);
                if (lastDriverId !== -1) {
                    currentRanks = Array(n).fill(0);
                    let startIdx = (lastDriverId + 1) % n;
                    let currentRank = 1;
                    for (let k = 0; k < n; k++) {
                        const targetIdx = (startIdx + k) % n;
                        currentRanks[targetIdx] = currentRank++;
                    }
                }

                const getPrevDate = (d, offset) => { const dateObj = new Date(d); dateObj.setDate(dateObj.getDate() - offset); return dateObj.toISOString().split('T')[0]; };
                const d1 = getPrevDate(dateStr, 1); const d2 = getPrevDate(dateStr, 2);
                const excludedIds = new Set();
                if (allScheduleWithRanks[d1]) {
                    allScheduleWithRanks[d1].dispatchResult.forEach(r => { if (r.info?.duration >= 2 && !r.info?.isCancelled) r.slots.forEach(s => s && !s.isExcluded && !s.isCancelledByRank && excludedIds.add(s.id)); });
                }
                if (allScheduleWithRanks[d2]) {
                    allScheduleWithRanks[d2].dispatchResult.forEach(r => { if (r.info?.duration >= 3 && !r.info?.isCancelled) r.slots.forEach(s => s && !s.isExcluded && !s.isCancelledByRank && excludedIds.add(s.id)); });
                }

                const employedStatus = driverNames.map((_, i) => {
                    const joined = driverJoinDates[i];
                    const left = driverLeaveDates[i];
                    if (joined && dateStr < joined) return false;
                    if (left && dateStr >= left) return false;
                    return true;
                });

                const rawDayData = scheduleData[dateStr] || {};
                return { 
                    reserved: rawDayData.reserved || {}, 
                    driverStatus: adaptStatus(rawDayData.driverStatus, true, n), 
                    ondutyStatus: adaptStatus(rawDayData.ondutyStatus, false, n), 
                    tempOffStatus: adaptStatus(rawDayData.tempOffStatus, false, n),
                    cancelStatus: adaptStatus(rawDayData.cancelStatus, false, n),
                    driverRanks: currentRanks, overrides: rawDayData.overrides || {}, isHoliday: isPublicHoliday(dateStr), dailyMemo: rawDayData.dailyMemo || "", workLogs: rawDayData.workLogs || {}, _excludedIds: excludedIds, dispatchResult: [], employedStatus
                };
            };

            const currentDayData = useMemo(() => { 
                return { ...getCalculatedDayData(selectedDateStr) };

            const calculateStatsForRange = (startYear, startMonth, endYear, endMonth, limitToToday = false) => {

                const stats = driverNames.map(nm => ({ nm, c1:0, c2:0, c3:0, tA:0, tM:0, typeCounts: {}, totalMoney: 0, totalHours: 0 }));
                for(let m = startMonth; m <= endMonth; m++) {
                    const lastD = new Date(startYear, m + 1, 0).getDate();
                    for(let d = 1; d <= lastD; d++) {
                        const dStr = startYear + "-" + String(m + 1).padStart(2,'0') + "-" + String(d).padStart(2,'0');
                        if (limitToToday && dStr > todayStr) continue; 
                        const dayData = getCalculatedDayData(dStr);
                        const dispatch = dayData.dispatchResult || [];
                        dispatch.forEach(item => {
                            const info = item.info;
                            if (!info || info.isCancelled) return;
                            const t = calculateTotalWorkHours(info, dStr);
                            if (!t.valid) return;
                            const pay = calculatePay(info);
                            item.slots.forEach(slot => {
                                if (slot && slot.id !== -1 && !slot.isExcluded && !slot.isCancelledByRank) {
                                    const dId = slot.id;
                                    if (stats[dId]) {

                                        else if (info.duration === 2) stats[dId].c2++;

                                        stats[dId].tA += t.adjusted;

                                        (pastDayData.dispatchResult || []).forEach(item => {

                                                else {

                                                    else if (item.info.operationType === '시티투어') colorClass = "bg-blue-50 text-blue-700 font-bold border border-blue-100";

                                                if (!vehicleGroups[item.vehicle.id]) {

                                                }

                                                            ))}
                                                            {adminEmails.length === 0 && <span className="text-[10px] text-slate-400 italic">등록된 관리자가 없습니다. (첫 로그인 계정이 관리자가 됩니다.)</span>}
                                                        </div>
                                                    </div>
                                                </div>
                                            )}
                                        </div>
                                    </>
                                )}

                                {modal.type === 'systemLogs' && (
                                    <>
                                        <div className="p-4 border-b font-bold flex justify-between bg-slate-800 text-white shrink-0">
                                            <h3 className="flex items-center gap-2"><Icons.ClipboardList className="w-4 h-4"/>시스템 변경 기록 (로그)</h3>
                                            <button onClick={() => setModal({ type: 'data' })} className="hover:text-slate-300"><Icons.X className="w-4 h-4"/></button>
                                        </div>
                                        <div className="p-4 overflow-y-auto flex-grow bg-slate-50 space-y-2">
                                            {dispatchLogs.concat(pastDispatchLogs).length === 0 ? <div className="text-center text-slate-400 text-sm py-10">기록된 변동사항이 없습니다.</div> : (
                                                <div className="overflow-x-auto rounded-lg border border-slate-200 shadow-sm bg-white">
                                                    <table className="w-full text-left text-xs min-w-[500px]">
                                                        <thead className="bg-slate-100 text-slate-600 border-b border-slate-200 font-bold">
                                                            <tr><th className="p-2 text-center">변경 일시</th><th className="p-2 text-center">적용 일자</th><th className="p-2">변경 내용</th><th className="p-2 text-center">작업자</th></tr>
                                                        </thead>
                                                        <tbody>
                                                            {dispatchLogs.concat(pastDispatchLogs).sort((a,b) => new Date(b.timestamp).getTime() - new Date(a.timestamp).getTime()).map((log, index) => (
                                                                <tr key={`${log.id}-${index}`} className="border-b border-slate-50 hover:bg-slate-50 transition">
                                                                    <td className="p-2 text-center text-[10px] text-slate-500 whitespace-nowrap">{log.timestamp}</td>
                                                                    <td className="p-2 text-center font-bold text-slate-600 whitespace-nowrap">{log.targetDate}</td>
                                                                    <td className="p-2 font-bold text-slate-700">{log.content}</td>
                                                                    <td className="p-2 text-center text-[10px] text-slate-500 whitespace-nowrap">{log.author}</td>
                                                                </tr>
                                                            ))}
                                                        </tbody>
                                                    </table>
                                                </div>
                                            )}
                                        </div>
                                    </>
                                )}

                                {modal.type === 'paySettings' && (
                                    <>
                                        <div className="p-4 border-b font-bold flex justify-between"><h3>관외비 설정</h3><button onClick={() => setModal({ type: null })}><Icons.X className="w-4 h-4"/></button></div>
                                        <div className="p-6 space-y-4">
                                            <div><label className="text-xs font-bold mb-1 block">당일 운행 수당</label><input type="number" id="payDayInput" defaultValue={paySettings.day} className="w-full border rounded-lg p-2 font-bold"/></div>
                                            <div><label className="text-xs font-bold mb-1 block">숙박 운행 (1일당 수당)</label><input type="number" id="paySleepInput" defaultValue={paySettings.sleep} className="w-full border rounded-lg p-2 font-bold"/></div>
                                            <div><label className="text-xs font-bold mb-1 block">성묘 지원 수당</label><input type="number" id="payGraveInput" defaultValue={paySettings.grave} className="w-full border rounded-lg p-2 font-bold"/></div>
                                            <div><label className="text-xs font-bold mb-1 block">나들이 수당</label><input type="number" id="payPicnicInput" defaultValue={paySettings.picnic} className="w-full border rounded-lg p-2 font-bold"/></div>
                                            <button onClick={() => updatePaySettings(document.getElementById('payDayInput').value, document.getElementById('paySleepInput').value, document.getElementById('payGraveInput').value, document.getElementById('payPicnicInput').value)} className="w-full bg-slate-900 text-white py-3 rounded-xl font-bold">저장하기</button>
                                        </div>
                                    </>
                                )}

                                {/* 💡 일반 인원 관리 (제외된 사람은 나오지 않음) */}
                                {modal.type === 'drivers' && (
                                    <>
                                        <div className="p-4 border-b font-bold flex justify-between bg-orange-50 text-orange-700 shrink-0">
                                            <h3>운전자 명단 관리</h3>
                                            <button onClick={() => setModal({ type: null })}><Icons.X className="w-4 h-4"/></button>
                                        </div>
                                        <div className="p-4 shrink-0 bg-white border-b flex flex-col gap-3">
                                            <div className="flex gap-2">
                                                <input type="text" id="newDriverName" placeholder="새 운전자 이름" className="w-full text-xs border rounded p-2 font-bold outline-none focus:border-orange-400" onKeyDown={(e) => { if(e.key==='Enter') { addDriver(e.target.value); e.target.value=''; }}}/>
                                                <button onClick={() => { const el = document.getElementById('newDriverName'); addDriver(el.value); el.value=''; }} className="bg-slate-800 text-white w-12 rounded text-xs font-bold">등록</button>
                                            </div>
                                            <div className="text-[10px] text-slate-500 font-bold bg-slate-50 p-2 rounded border border-slate-100 break-keep leading-relaxed">
                                                * 이곳에서 제외(삭제)한 인원은 <b>'제외 운전자 게시판'</b>에서 따로 관리 및 복원할 수 있습니다.<br/>
                                                * 순번 유지를 위해 목록 정렬 버튼은 영구 제거되었습니다.
                                            </div>
                                        </div>
                                        <div className="p-4 overflow-y-auto flex-grow bg-slate-50 space-y-2">
                                            {driverNames.map((nm, i) => {
                                                const isNameActive = nm !== "" && nm !== undefined;
                                                const isLeft = !!driverLeaveDates[i];
                                                
                                                // 💡 제외된 인원은 아예 그리지 않음!
                                                if (!isNameActive || isLeft) return null;

                                                return (
                                                    <div key={i} className="flex justify-between items-center p-2.5 border rounded-lg bg-white hover:border-blue-200 transition-colors shadow-sm">
                                                        <span className="shrink-0 p-1.5 rounded-md w-8 h-8 text-white bg-emerald-500 flex items-center justify-center cursor-default"><Icons.UserCheck className="w-4 h-4"/></span>
                                                        <span className="w-12 text-center border border-slate-100 rounded bg-slate-50 py-1 mx-2 text-[10px] text-slate-400 font-black cursor-not-allowed">No. {i}</span>
                                                        <AutoSaveInput value={nm || ""} onSave={(val) => updateDriverName(i, val)} className="w-full outline-none font-bold text-slate-700" />
                                                        <button onClick={() => removeDriver(i)} className="text-slate-300 hover:text-red-500 shrink-0 p-1.5 transition-colors" title="명단에서 제외하기"><Icons.Trash2 className="w-4 h-4"/></button>
                                                    </div>
                                                );
                                            })}
                                            {driverNames.filter((nm, i) => nm && !driverLeaveDates[i]).length === 0 && <div className="text-center text-slate-400 text-xs py-10">가동 중인 운전자가 없습니다.</div>}
                                        </div>
                                    </>
                                )}

                                {/* 💡 제외 운전자 게시판 (제외된 사람만 나옴) */}
                                {modal.type === 'excludedDrivers' && (
                                    <>
                                        <div className="p-4 border-b font-bold flex justify-between bg-slate-800 text-white shrink-0">
                                            <h3 className="flex items-center gap-2"><Icons.UserX className="w-4 h-4"/> 제외 운전자 (퇴사자) 관리</h3>
                                            <button onClick={() => setModal({ type: null })} className="hover:text-slate-300"><Icons.X className="w-4 h-4"/></button>
                                        </div>
                                        <div className="p-4 shrink-0 bg-white border-b flex flex-col gap-3">
                                            <div className="text-[11px] text-slate-600 font-bold bg-slate-50 p-3 rounded-lg border border-slate-200 break-keep leading-relaxed shadow-sm">
                                                💡 이곳에 있는 인원들은 과거 배차 기록과 고유 번호(ID)는 정상적으로 보호/유지되지만, 이후의 배차 로직 및 <b>'일일 상태 명단'</b>에서는 영구히 숨김 처리된 상태입니다.<br/><br/>실수로 지웠거나 복직했을 경우 <b>[복원 버튼]</b>을 눌러 다시 활성화할 수 있습니다.
                                            </div>
                                        </div>
                                        <div className="p-4 overflow-y-auto flex-grow bg-slate-100 space-y-2">
                                            {driverNames.map((nm, i) => {
                                                const isNameActive = nm !== "" && nm !== undefined;
                                                const isLeft = !!driverLeaveDates[i];
                                                
                                                // 💡 제외되지 않은 사람은 아예 그리지 않음!
                                                if (!isNameActive || !isLeft) return null;

                                                return (
                                                    <div key={i} className="flex justify-between items-center p-2.5 border border-slate-200 rounded-lg bg-slate-50 opacity-90 shadow-sm">
                                                        <button onClick={() => restoreDriver(i)} className="shrink-0 p-1.5 rounded-md w-8 h-8 flex items-center justify-center text-white bg-slate-400 hover:bg-emerald-500 transition-colors shadow" title="이 인원 복원하기"><Icons.RotateCw className="w-4 h-4"/></button>
                                                        <span className="w-14 text-center py-1 mx-2 text-[10px] font-black text-rose-500 bg-rose-50 border border-rose-100 rounded shadow-sm">제외됨</span>
                                                        <span className="w-full font-bold text-slate-500 line-through truncate px-1">{nm}</span>
                                                        <span className="text-[10px] font-bold text-slate-400 shrink-0 bg-white border border-slate-200 px-2 py-1 rounded whitespace-nowrap shadow-sm">{driverLeaveDates[i]} 제외</span>
                                                    </div>
                                                );
                                            })}
                                            {driverNames.filter((nm, i) => nm && driverLeaveDates[i]).length === 0 && <div className="text-center text-slate-400 text-sm py-10 font-bold">제외된 인원이 없습니다.</div>}
                                        </div>
                                    </>
                                )}

                                {modal.type === 'vehicles' && (
                                    <>
                                        <div className="p-4 border-b font-bold flex justify-between"><h3>차량 관리</h3><button onClick={() => setModal({ type: null })}><Icons.X className="w-4 h-4"/></button></div>
                                        <div className="p-6">
                                            <div className="flex gap-2 mb-3 bg-slate-50 p-2 rounded-xl">
                                                <input type="text" id="addVName" placeholder="호차명" className="w-1/3 text-xs border rounded p-1.5"/>
                                                <input type="text" id="addVPlate" placeholder="번호" className="w-1/3 text-xs border rounded p-1.5"/>
                                                <select id="addVType" className="w-1/3 text-xs border rounded p-1.5"><option value="BUS">버스</option><option value="SOLATI">솔라티</option></select>
                                                <button onClick={()=>{ const n=document.getElementById('addVName').value, p=document.getElementById('addVPlate').value, t=document.getElementById('addVType').value; if(n) { addVehicle(n,p,t); document.getElementById('addVName').value=''; document.getElementById('addVPlate').value=''; } }} className="bg-slate-800 text-white w-12 rounded text-xs shrink-0">등록</button>
                                            </div>
                                            <div className="grid grid-cols-2 gap-2 max-h-[400px] overflow-y-auto">
                                                {vehiclesList.map(v => (
                                                    <div key={v.id} className="flex justify-between items-center p-3 border rounded-lg text-sm font-bold bg-white">
                                                        <div className="flex flex-col w-full mr-2"><span>{v.name}</span><AutoSaveInput value={v.plate} onSave={(val) => updateVehiclePlate(v.id, val)} className="text-[10px] text-slate-400 font-normal outline-none bg-transparent"/></div>
                                                        <button onClick={() => removeVehicle(v.id)} className="text-red-300 hover:text-red-500 shrink-0"><Icons.Trash2 className="w-4 h-4"/></button>
                                                    </div>
                                                ))}
                                            </div>
                                        </div>
                                    </>
                                )}

                                {modal.type === 'stats' && (
                                    <>
                                        <div className="p-5 border-b font-bold flex flex-col gap-3 bg-slate-50">
                                            <div className="flex justify-between items-center">
                                                <div className="flex gap-4">
                                                    <div className="flex bg-white rounded-lg border px-2 py-1"><button onClick={() => setStatsYear(y => y - 1)}><Icons.ChevronLeft className="w-4 h-4"/></button><span className="mx-2 text-lg font-black w-16 text-center">{statsYear}년</span><button onClick={() => setStatsYear(y => y + 1)}><Icons.ChevronRight className="w-4 h-4"/></button></div>
                                                    {statsMode === 'monthly' && <div className="flex bg-white rounded-lg border px-2 py-1"><button onClick={() => setStatsMonth(m => m === 0 ? 11 : m - 1)}><Icons.ChevronLeft className="w-4 h-4"/></button><span className="mx-2 text-lg font-black w-10 text-center">{statsMonth + 1}월</span><button onClick={() => setStatsMonth(m => m === 11 ? 0 : m + 1)}><Icons.ChevronRight className="w-4 h-4"/></button></div>}
                                                </div>
                                                <button onClick={() => setModal({ type: null })}><Icons.X className="w-6 h-6"/></button>
                                            </div>
                                            <div className="flex justify-between items-center">
                                                <div className="flex gap-2">
                                                    <div className="flex bg-white rounded-lg p-1 border shadow-sm"><button onClick={() => setStatsMode('monthly')} className={`px-4 py-1.5 text-xs font-bold rounded-md ${statsMode === 'monthly' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>월별 상세</button><button onClick={() => setStatsMode('yearly')} className={`px-4 py-1.5 text-xs font-bold rounded-md ${statsMode === 'yearly' ? 'bg-blue-600 text-white' : 'text-slate-500'}`}>연간 집계</button></div>
                                                    {statsMode === 'yearly' && <div className="flex bg-white rounded-lg p-1 border shadow-sm"><button onClick={() => setYearlyViewType('money')} className={`px-3 py-1.5 text-xs font-bold rounded-md ${yearlyViewType === 'money' ? 'bg-emerald-500 text-white' : 'text-slate-500'}`}>수당</button><button onClick={() => setYearlyViewType('hours')} className={`px-3 py-1.5 text-xs font-bold rounded-md ${yearlyViewType === 'hours' ? 'bg-orange-500 text-white' : 'text-slate-500'}`}>인정시간</button></div>}
                                                </div>
                                                <button onClick={handleDownloadExcel} className="bg-green-600 text-white px-3 py-1.5 rounded-lg text-xs font-bold hover:bg-green-700 transition flex items-center gap-1 shadow-sm"><Icons.FileExcel className="w-3 h-3"/>엑셀</button>
                                            </div>
                                        </div>
                                        <div className="flex-grow overflow-auto p-0 bg-white">
                                            {statsMode === 'monthly' ? (
                                                <table className="w-full text-left font-bold text-sm stats-table min-w-[900px]">
                                                    <thead className="bg-slate-50 border-b text-slate-500 text-xs uppercase">
                                                        <tr>{['이름','당일','1박','2박','공공','시티','나들이','성묘','기타','인정(h)','금월 수당','금년 예상합계'].map(h => <th key={h} className="text-center p-2">{h}</th>)}</tr>
                                                    </thead>
                                                    <tbody>
                                                        {(() => {
                                                            const stats = calculateStatsForRange(statsYear, statsMonth, statsYear, statsMonth, true);
                                                            const yearlyStatsAll = calculateStatsForRange(statsYear, 0, statsYear, 11, false);
                                                            return stats.map((s, i) => s.nm ? (
                                                                <tr key={i} className="border-b border-slate-50 hover:bg-slate-50 text-center">
                                                                    <td className="p-2 font-extrabold">{getMaskedName(s.nm, getTodayStr(), false)}</td><td>{s.c1||'-'}</td><td>{s.c2||'-'}</td><td>{s.c3||'-'}</td>
                                                                    <td>{s.typeCounts['공공예약']||'-'}</td><td>{s.typeCounts['시티투어']||'-'}</td><td>{s.typeCounts['나들이']||'-'}</td><td>{s.typeCounts['성묘지원']||'-'}</td><td>{s.typeCounts['기타']||'-'}</td>
                                                                    <td className="text-blue-600 border-l">{s.tA.toFixed(3)}</td><td className="text-emerald-600">{s.tM.toLocaleString()}</td>
                                                                    <td className="bg-blue-50/50 text-blue-800 border-l">{(yearlyStatsAll[i]?.totalMoney || 0).toLocaleString()}</td>
                                                                </tr>
                                                            ) : null);
                                                        })()}
                                                    </tbody>
                                                </table>
                                            ) : (
                                                <table className="w-full text-left font-bold text-xs stats-table min-w-[1200px]">
                                                    <thead className="bg-slate-50 border-b text-slate-600 text-xs uppercase">
                                                        <tr><th className="p-2 sticky left-0 bg-slate-50 z-20 border-r text-center">이름</th>{Array.from({length: 12}).map((_, m) => (<th key={m} className="text-center p-2 min-w-[60px]">{m+1}월</th>))}<th className="text-center bg-blue-50 text-blue-700 z-10 sticky right-0">합계</th></tr>
                                                    </thead>
                                                    <tbody>
                                                        {(() => {
                                                            const stats = driverNames.map(nm => ({ nm, months: Array(12).fill({m:0, h:0}), totalMoney:0, totalHours:0 }));
                                                            for(let m=0; m<12; m++) { const mStats = calculateStatsForRange(statsYear, m, statsYear, m, true); mStats.forEach((d, idx) => { if (stats[idx]) { stats[idx].months[m] = { m: d.tM, h: d.tA }; stats[idx].totalMoney += d.tM; stats[idx].totalHours += d.tA; } }); }
                                                            return stats.filter(s => s.nm).map((s, i) => {
                                                                const rowTotal = yearlyViewType === 'money' ? s.totalMoney : s.totalHours;
                                                                return (
                                                                    <tr key={i} className="border-b border-slate-50 text-center">
                                                                        <td className="p-2 sticky left-0 bg-white z-10 border-r">{getMaskedName(s.nm, getTodayStr(), false)}</td>
                                                                        {s.months.map((d, m) => { const val = yearlyViewType === 'money' ? d.m : d.h; return <td key={m} className="p-2">{val > 0 ? (yearlyViewType === 'money' ? val.toLocaleString() : val.toFixed(3)) : '-'}</td>; })}
                                                                        <td className="p-2 bg-blue-50/30 text-blue-700 sticky right-0 border-l">{yearlyViewType === 'money' ? rowTotal.toLocaleString() : rowTotal.toFixed(3)}</td>
                                                                    </tr>
                                                                );
                                                            });
                                                        })()}
                                                    </tbody>
                                                </table>
                                            )}
                                        </div>
                                    </>
                                )}

                            </div>
                        </div>
                    )}

                </div>
            );
        };

        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
