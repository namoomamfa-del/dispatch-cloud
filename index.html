        const DEFAULT_PAY_SETTINGS = { day: 12500, sleep: 37500, grave: 0, picnic: 0 };
        const getTodayStr = () => { const now = new Date(); return new Date(now.getTime() + (9 * 60 * 60 * 1000)).toISOString().split('T')[0]; };
        const getTodayDate = () => { const [y, m, d] = getTodayStr().split('-'); return new Date(parseInt(y), parseInt(m) - 1, parseInt(d)); };

        const parseLocalDate = (dateStr) => {
            if (!dateStr) return new Date();
            const [y, m, d] = dateStr.split('-').map(Number);
            return new Date(y, m - 1, d);
        };

        const SOLAR_HOLIDAYS = { "01-01": "신정", "03-01": "삼일절", "05-05": "어린이날", "06-06": "현충일", "08-15": "광복절", "10-03": "개천절", "10-09": "한글날", "12-25": "성탄절" };
        const generateHolidays = () => {
            const calendar = new KoreanLunarCalendar();
            const holidays = {};
            const addSubstitute = (dateStr, name, originalDateObj) => {
                const day = originalDateObj.getDay(); 
                let subDate = new Date(originalDateObj);
                let needed = false;
                if (["설날 연휴", "설날", "추석 연휴", "추석"].includes(name)) { if (day === 0) needed = true; } 
                else if (["어린이날", "삼일절", "광복절", "개천절", "한글날", "성탄절", "부처님오신날"].includes(name)) { if (day === 0 || day === 6) needed = true; }
                if (needed) {
                    subDate.setDate(subDate.getDate() + 1);
                    if (day === 6) subDate.setDate(subDate.getDate() + 1); 
                    while (holidays[subDate.toISOString().split('T')[0]]) subDate.setDate(subDate.getDate() + 1);
                    holidays[subDate.toISOString().split('T')[0]] = "대체공휴일";
                }
            };
            for (let year = 2024; year <= 2054; year++) {
                Object.entries(SOLAR_HOLIDAYS).forEach(([md, name]) => {
                    const dateStr = `${year}-${md}`; holidays[dateStr] = name;
                    if (name !== "신정" && name !== "현충일") addSubstitute(dateStr, name, new Date(year, parseInt(md.split('-')[0])-1, parseInt(md.split('-')[1])));
                });
                const lunarEvents = [{ m: 1, d: 1, name: "설날" }, { m: 4, d: 8, name: "부처님오신날" }, { m: 8, d: 15, name: "추석" }];
                lunarEvents.forEach(evt => {
                    calendar.setLunarDate(year, evt.m, evt.d, false);
                    const solar = calendar.getSolarCalendar();
                    const dateStr = `${solar.year}-${String(solar.month).padStart(2,'0')}-${String(solar.day).padStart(2,'0')}`;
                    const dateObj = new Date(solar.year, solar.month - 1, solar.day);
                    if (evt.name === "설날" || evt.name === "추석") {
                        const prevDate = new Date(dateObj); prevDate.setDate(dateObj.getDate() - 1);
                        const nextDate = new Date(dateObj); nextDate.setDate(dateObj.getDate() + 1);
                        holidays[prevDate.toISOString().split('T')[0]] = `${evt.name} 연휴`;
                        holidays[dateStr] = evt.name;
                        holidays[nextDate.toISOString().split('T')[0]] = `${evt.name} 연휴`;
                        [prevDate, dateObj, nextDate].forEach(d => {
                            if (d.getDay() === 0) {
                                let sub = new Date(nextDate); sub.setDate(sub.getDate() + 1);
                                while(holidays[sub.toISOString().split('T')[0]]) sub.setDate(sub.getDate() + 1);
                                holidays[sub.toISOString().split('T')[0]] = "대체공휴일";
                            }
                        });
                    } else { holidays[dateStr] = evt.name; addSubstitute(dateStr, evt.name, dateObj); }
                });
            }
            return holidays;
        };
        const GENERATED_HOLIDAYS = generateHolidays();
        const getHolidayName = (dateStr) => GENERATED_HOLIDAYS[dateStr] || null;
        const isPublicHoliday = (dateStr) => {
            if (!dateStr) return false;
            const dayOfWeek = new Date(dateStr).getDay();
            if (dayOfWeek === 0 || dayOfWeek === 6) return true;
            return !!GENERATED_HOLIDAYS[dateStr];
        };

        const calculateWorkHours = (start, end, isDateHoliday, isForceHoliday) => {
            if (!start || !end) return { work: 0, extra: 0, adjusted: 0, valid: false };
            const [sH, sM] = start.split(':').map(Number);
            const [eH, eM] = end.split(':').map(Number);
            let startMin = sH * 60 + sM;
            let endMin = eH * 60 + eM;
            if (endMin < startMin) endMin += 24 * 60;
            let diffMin = endMin - startMin;
            let totalHours = diffMin / 60;
            const work = Math.max(0, totalHours - 1); 
            let extra = 0, adjusted = 0;
            if (isDateHoliday || isForceHoliday) {
                const regularHolidayWork = Math.min(8, work);
                const overtimeHolidayWork = Math.max(0, work - 8);
                adjusted = (regularHolidayWork * 1.5) + (overtimeHolidayWork * 2.0);
                extra = overtimeHolidayWork; 
            } else {
                const overtimeWeekday = Math.max(0, work - 8);
                adjusted = overtimeWeekday * 1.5;
                extra = overtimeWeekday;
            }
            return { work: parseFloat(work.toFixed(1)), extra: parseFloat(extra.toFixed(1)), adjusted: parseFloat(adjusted.toFixed(3)), valid: true };
        };

        const calculateTotalWorkHours = (info, startDateStr) => {
            if (!info) return { work: 0, extra: 0, adjusted: 0, valid: false };
            let totalWork = 0; let totalExtra = 0; let totalAdjusted = 0; let valid = true;
            const times = info.dailyTimes || [{ startTime: info.startTime || '09:00', endTime: info.endTime || '18:00', isHolidayWork: info.isHolidayWork || false }];
            times.forEach((dayTime, idx) => {
                const d = new Date(startDateStr); d.setDate(d.getDate() + idx);
                const dStr = d.toISOString().split('T')[0];
                const res = calculateWorkHours(dayTime.startTime, dayTime.endTime, isPublicHoliday(dStr), dayTime.isHolidayWork);
                if (!res.valid) valid = false;
                totalWork += res.work; totalExtra += res.extra; totalAdjusted += res.adjusted;
            });
            return { work: parseFloat(totalWork.toFixed(1)), extra: parseFloat(totalExtra.toFixed(1)), adjusted: parseFloat(totalAdjusted.toFixed(3)), valid };
        };

        const DEFAULT_DRIVERS = ["박기준", "변석현", "이명순", "김탁", "한상훈", "문인식", "황덕일", "강철규", "이상헌"];

            const handleBlur = () => { if (localValue !== (value || "")) { onSave(localValue); } };

                const duration = info.duration || 1;

                    cancelled: dayData.cancelStatus ? dayData.cancelStatus[i] : false,
                    rank: currentRanks[i] 
                })).filter(d => d.active && !excludedDriverIds.has(d.id)).sort((a, b) => a.rank - b.rank);
                
                const resIds = Object.keys(dayData.reserved || {});
                const sortedV = vehicles.filter(v => resIds.includes(v.id)).sort((a, b) => {
                    const infoA = dayData.reserved[a.id] || {}; const infoB = dayData.reserved[b.id] || {};
                    if (a.type !== b.type) return a.type === 'BUS' ? -1 : 1;
                    const durationA = (infoA.duration === 2 || infoA.duration === 3) ? infoA.duration : 1;
                    const durationB = (infoB.duration === 2 || infoB.duration === 3) ? infoB.duration : 1;
                    if (durationA !== durationB) return durationA - durationB;
                    if ((infoA.km || 0) !== (infoB.km || 0)) return (infoA.km || 0) - (infoB.km || 0);
                    if (a.type === 'BUS') {
                        const getBusRank = (name) => { if (name.includes('3호')) return 1; if (name.includes('1호')) return 2; if (name.includes('2호')) return 3; return 4; };
                        return getBusRank(a.name) - getBusRank(b.name);
                    }
                    return a.name.localeCompare(b.name);
                });

                const result = [];
                const manualAssignments = {}; 
                Object.entries(dayData.overrides || {}).forEach(([key, dId]) => { manualAssignments[key] = dId; pool = pool.filter(p => p.id !== dId); });

                        if (!info.isEmergency && pool.length > 0) autoDriver = pool.shift();

                        if (manualAssignments[key] !== undefined) {
                            const dId = manualAssignments[key];
                            slots.push({ nm: drivers[dId] || '삭제됨', id: dId, type: info.isEmergency ? 'emergency' : 'manual', rank: currentRanks[dId], consumedAutoDriverId: autoDriver ? autoDriver.id : undefined });
                        } else if (info.isUnavailable) {
                            slots.push(autoDriver ? { ...autoDriver, type: 'excluded', isExcluded: true } : null);
                        } else {
                            if (autoDriver && (autoDriver.cancelled || autoDriver.tempOff)) {
                                slots.push({ ...autoDriver, isCancelledByRank: true });
                            } else {
                                slots.push(autoDriver ? { ...autoDriver, type: 'auto' } : null);
                            }
                        }
                    }
                    result.push({ vehicle: v, slots, info: info });
                });

            const allScheduleWithRanks = useMemo(() => {

                dates.forEach(date => {
                    const validDriverIds = driverNames.map((_, i) => i).filter(i => isDriverActiveOnDate(i, date));

                    if (lastDriverId !== -1) {
                        const newRanks = Array(n).fill(0);
                        let startValidIdx = validDriverIds.indexOf(lastDriverId);
                        if (startValidIdx === -1) {
                            startValidIdx = validDriverIds.findIndex(id => id > lastDriverId);
                            if (startValidIdx === -1) startValidIdx = 0;
                        } else {
                            startValidIdx = (startValidIdx + 1) % validDriverIds.length;
                        }
                        
                        let currentRank = 1;
                        for (let k = 0; k < validDriverIds.length; k++) { 
                            newRanks[validDriverIds[(startValidIdx + k) % validDriverIds.length]] = currentRank++; 
                        }
                        currentRanks = newRanks;
                    }

                    const rawDayData = scheduleData[date] || {};
                    const getPrevDate = (d, offset) => { const dateObj = new Date(d); dateObj.setDate(dateObj.getDate() - offset); return dateObj.toISOString().split('T')[0]; };
                    const d1 = getPrevDate(date, 1); const d2 = getPrevDate(date, 2);
                    const excludedIds = new Set();
                    if (processedSchedule[d1]) {
                        processedSchedule[d1].dispatchResult.forEach(r => { if (r.info?.duration >= 2 && !r.info?.isCancelled) r.slots.forEach(s => s && !s.isExcluded && !s.isCancelledByRank && excludedIds.add(s.id)); });
                    }
                    if (processedSchedule[d2]) {
                        processedSchedule[d2].dispatchResult.forEach(r => { if (r.info?.duration >= 3 && !r.info?.isCancelled) r.slots.forEach(s => s && !s.isExcluded && !s.isCancelledByRank && excludedIds.add(s.id)); });
                    }

                    const computedDayData = { 
                        ...rawDayData, 
                        driverRanks: currentRanks, 
                        ondutyStatus: adaptStatus(rawDayData.ondutyStatus, false, n), 
                        driverStatus: adaptStatus(rawDayData.driverStatus, true, n),

                    };
                    const dispatchResult = calculateDispatchLogic(computedDayData, driverNames, vehiclesList, excludedIds, date);

                    for (let i = 0; i < dispatchResult.length; i++) {
                        const item = dispatchResult[i];

                        for (let j = 0; j < item.slots.length; j++) {

                                 if (targetId !== -1 && currentRanks[targetId] > maxRank) {
                                     maxRank = currentRanks[targetId];
                                     dailyLastDriver = targetId;
                                 }
                             }
                        }
                    }

                    for(let i=0; i<n; i++) {
                        if (isDriverActiveOnDate(i, date) && (computedDayData.cancelStatus[i] || computedDayData.tempOffStatus[i]) && currentRanks[i] > maxRank) {
                            maxRank = currentRanks[i];
                            dailyLastDriver = i;
                        }
                    }

                    if (dailyLastDriver !== -1) lastDriverId = dailyLastDriver;
                    processedSchedule[date] = { ...computedDayData, dispatchResult, lastDriverId: dailyLastDriver !== -1 ? dailyLastDriver : lastDriverId, excludedIds };
                });

                            <div className="bg-white w-full rounded-2xl overflow-hidden shadow-2xl flex flex-col max-w-6xl h-[90vh]">
                                <div className="p-5 border-b font-bold flex justify-between items-center bg-slate-800 text-white shrink-0">
                                    <h3 className="text-lg flex items-center gap-2"><Icons.PieChart className="w-5 h-5"/>근무 시간 및 수당 정산</h3>
                                    <button onClick={() => setModal({ type: null })} className="hover:text-slate-300 transition-colors"><Icons.X className="w-5 h-5"/></button>
                                </div>
                                <div className="p-4 bg-slate-100 border-b flex flex-wrap gap-4 items-center justify-between shrink-0">
                                    <div className="flex bg-white rounded-lg p-1 shadow-sm border border-slate-200">
                                        <button onClick={() => setStatsMode('monthly')} className={`px-4 py-1.5 rounded-md text-sm font-black transition-colors ${statsMode==='monthly' ? 'bg-emerald-500 text-white shadow' : 'text-slate-500 hover:bg-slate-50'}`}>월간 보기</button>
                                        <button onClick={() => setStatsMode('yearly')} className={`px-4 py-1.5 rounded-md text-sm font-black transition-colors ${statsMode==='yearly' ? 'bg-emerald-500 text-white shadow' : 'text-slate-500 hover:bg-slate-50'}`}>연간(개인별) 보기</button>
                                    </div>
                                    {statsMode === 'monthly' ? (
                                        <div className="flex gap-2 items-center bg-white px-3 py-1.5 rounded-lg shadow-sm border border-slate-200">
                                            <button onClick={() => changeStatsMonth(-1)} className="p-1 hover:bg-slate-100 rounded-full"><Icons.ChevronLeft className="w-4 h-4 text-slate-600"/></button>
                                            <span className="font-extrabold text-sm text-slate-700 w-24 text-center">{statsYear}년 {statsMonth + 1}월</span>
                                            <button onClick={() => changeStatsMonth(1)} className="p-1 hover:bg-slate-100 rounded-full"><Icons.ChevronRight className="w-4 h-4 text-slate-600"/></button>
                                        </div>
                                    ) : (
                                        <div className="flex gap-4 items-center">
                                            <div className="flex gap-2 items-center bg-white px-3 py-1.5 rounded-lg shadow-sm border border-slate-200">
                                                <button onClick={() => setStatsYear(statsYear - 1)} className="p-1 hover:bg-slate-100 rounded-full"><Icons.ChevronLeft className="w-4 h-4 text-slate-600"/></button>
                                                <span className="font-extrabold text-sm text-slate-700 w-16 text-center">{statsYear}년</span>
                                                <button onClick={() => setStatsYear(statsYear + 1)} className="p-1 hover:bg-slate-100 rounded-full"><Icons.ChevronRight className="w-4 h-4 text-slate-600"/></button>
                                            </div>
                                            <select value={yearlyViewType} onChange={(e) => setYearlyViewType(e.target.value)} className="bg-white border border-slate-200 rounded-lg p-2 text-sm font-bold shadow-sm outline-none">
                                                <option value="money">수당 금액 보기</option><option value="hours">초과 시간 보기</option>
                                            </select>
                                        </div>
                                    )}
                                </div>
                                <div className="flex-1 overflow-auto bg-slate-50 relative">
                                    <table className="w-full text-center text-sm whitespace-nowrap border-collapse stats-table">
                                        <thead className="bg-slate-200 text-slate-700 font-extrabold shadow-sm">
                                            {statsMode === 'monthly' ? (
                                                <tr>
                                                    <th className="border p-3 sticky left-0 bg-slate-200 z-20 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">이름</th>
                                                    <th className="border p-3">총 운행일</th><th className="border p-3">총 수당</th><th className="border p-3">총 초과(인정)</th><th className="border p-3">총 초과(실제)</th>
                                                    {Array.from({length: new Date(statsYear, statsMonth + 1, 0).getDate()}).map((_, i) => (
                                                        <th key={i} className={`border p-2 min-w-[60px] ${new Date(statsYear, statsMonth, i+1).getDay()===0?'text-red-500':new Date(statsYear, statsMonth, i+1).getDay()===6?'text-blue-500':''}`}>{i+1}일</th>
                                                    ))}
                                                </tr>
                                            ) : (
                                                <tr>
                                                    <th className="border p-3 sticky left-0 bg-slate-200 z-20 shadow-[2px_0_5px_-2px_rgba(0,0,0,0.1)]">이름</th>
                                                    <th className="border p-3">연간 총합</th>
                                                    {Array.from({length: 12}).map((_, i) => <th key={i} className="border p-3 min-w-[80px]">{i+1}월</th>)}
                                                </tr>
                                            )}
                                        </thead>
                                        <tbody className="bg-white">
                                            {driverNames.map((nm, dIdx) => {
                                                if (!nm) return null;
                                                // 월간 통계 계산
                                                let monthlyDays = 0, monthlyPay = 0, monthlyWork = 0, monthlyExtra = 0, monthlyAdjusted = 0;
                                                const dailyStats = [];
                                                if (statsMode === 'monthly') {
                                                    const daysInMonth = new Date(statsYear, statsMonth + 1, 0).getDate();
                                                    for (let i = 1; i <= daysInMonth; i++) {
                                                        const dStr = `${statsYear}-${String(statsMonth+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                                                        const dData = getCalculatedDayData(dStr);
                                                        let worked = false, pay = 0, workH = 0, extraH = 0, adjH = 0, type = '';
                                                        
                                                        dData.dispatchResult.forEach(res => {
                                                            if (res.info?.isCancelled) return;
                                                            res.slots.forEach(slot => {
                                                                if (slot && !slot.isExcluded && slot.id === dIdx && !slot.isCancelledByRank) {
                                                                    worked = true; pay = calculatePay(res.info); type = res.info.operationType || '공공예약';
                                                                    const times = calculateTotalWorkHours(res.info, dStr);
                                                                    workH = times.work; extraH = times.extra; adjH = times.adjusted;
                                                                }
                                                            });
                                                        });
                                                        
                                                        if (worked) { monthlyDays++; monthlyPay += pay; monthlyWork += workH; monthlyExtra += extraH; monthlyAdjusted += adjH; }
                                                        dailyStats.push({ worked, pay, adjH, extraH, type });
                                                    }
                                                }

                                                // 연간 통계 계산
                                                const yearlyData = Array(12).fill(0);
                                                let yearlyTotal = 0;
                                                if (statsMode === 'yearly') {
                                                    for (let m = 0; m < 12; m++) {
                                                        const daysInM = new Date(statsYear, m + 1, 0).getDate();
                                                        let mTotal = 0;
                                                        for (let i = 1; i <= daysInM; i++) {
                                                            const dStr = `${statsYear}-${String(m+1).padStart(2,'0')}-${String(i).padStart(2,'0')}`;
                                                            const dData = getCalculatedDayData(dStr);
                                                            dData.dispatchResult.forEach(res => {
                                                                if (res.info?.isCancelled) return;
                                                                res.slots.forEach(slot => {
                                                                    if (slot && !slot.isExcluded && slot.id === dIdx && !slot.isCancelledByRank) {
                                                                        if (yearlyViewType === 'money') mTotal += calculatePay(res.info);
                                                                        else mTotal += calculateTotalWorkHours(res.info, dStr).adjusted;
                                                                    }
                                                                });
                                                            });
                                                        }
                                                        yearlyData[m] = mTotal; yearlyTotal += mTotal;
                                                    }
                                                }

                                                return (
                                                    <tr key={dIdx} className="hover:bg-slate-50 transition-colors border-b">
                                                        <td className="border p-2 font-black sticky left-0 bg-white shadow-[2px_0_5px_-2px_rgba(0,0,0,0.05)] z-10">{nm}</td>
                                                        {statsMode === 'monthly' ? (
                                                            <>
                                                                <td className="border p-2 font-bold text-slate-600">{monthlyDays}일</td>
                                                                <td className="border p-2 font-bold text-emerald-600">{monthlyPay.toLocaleString()}</td>
                                                                <td className="border p-2 font-bold text-blue-600">{monthlyAdjusted.toFixed(1)}h</td>
                                                                <td className="border p-2 font-bold text-rose-500">{monthlyExtra.toFixed(1)}h</td>
                                                                {dailyStats.map((ds, i) => (
                                                                    <td key={i} className="border p-1 text-[10px] leading-tight">
                                                                        {ds.worked ? (
                                                                            <div className="flex flex-col items-center justify-center h-full">
                                                                                <span className="font-bold text-emerald-600">{ds.pay > 0 ? (ds.pay/10000).toFixed(1)+'만' : '-'}</span>
                                                                                <span className="font-bold text-blue-600">{ds.adjH > 0 ? ds.adjH.toFixed(1)+'h' : '-'}</span>
                                                                            </div>
                                                                        ) : <span className="text-slate-200">-</span>}
                                                                    </td>
                                                                ))}
                                                            </>
                                                        ) : (
                                                            <>
                                                                <td className={`border p-2 font-black ${yearlyViewType==='money'?'text-emerald-600':'text-blue-600'}`}>{yearlyViewType==='money' ? yearlyTotal.toLocaleString() : yearlyTotal.toFixed(1)+'h'}</td>
                                                                {yearlyData.map((val, i) => <td key={i} className="border p-2 font-bold text-slate-600">{val > 0 ? (yearlyViewType==='money' ? val.toLocaleString() : val.toFixed(1)) : '-'}</td>)}
                                                            </>
                                                        )}
                                                    </tr>
                                                );
                                            })}
                                        </tbody>
                                    </table>
                                </div>
                            </div>
                        </div>
                    )}
                </div>
            );
        };

        const root = window.ReactDOM.createRoot(document.getElementById('root'));
        root.render(<App />);
    </script>
</body>
</html>
